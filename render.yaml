services:
  - type: web
    name: my-flask-app
    env: python
    region: oregon        # free tier region
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true   # Render auto-generates a secure secret key
    disk:
      name: sqlite-data
      mountPath: /var/data   # store SQLite DB here so it persists
      sizeGB: 1              # 1GB free persistent disk